
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة صباح الخير</title>
    <style>
        body {
            background-color: #f7f3f0;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .controls {
            margin-bottom: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls label, .controls button {
            background-color: #d4a373;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        .controls label:hover, .controls button:hover {
            background-color: #bc8a5f;
        }

        .controls input[type="file"] {
            display: none;
        }

        .color-group {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fff;
            padding: 0 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        /* تصميم البطاقة */
        .card-container {
            width: 380px;
            background: #fdfbf7;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 2px solid #e6dec9;
            text-align: center;
        }

        .card-header {
            background: linear-gradient(135deg, #f4eee1 0%, #e6dec9 100%);
            padding: 25px 20px;
            border-bottom: 1px solid #ddd;
        }

        .card-header h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 32px;
            color: #b08968;
            margin: 0 0 5px 0;
        }

        .card-header p {
            font-size: 14px;
            color: #7f5539;
            margin: 0;
        }

        .card-body {
            padding: 20px;
        }

        /* حاوية الصورة */
        .image-box {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 3px dashed #d4a373;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #faf5ed;
            cursor: pointer;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .image-box span {
            font-size: 11px;
            color: #888;
            padding: 10px;
        }

        /* الحقول القابلة للتعديل */
        .editable-text {
            font-size: 16px;
            color: #333;
            border: 1px dashed transparent;
            padding: 8px;
            width: 100%;
            text-align: center;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
            background: transparent;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .editable-text:hover, .editable-text:focus {
            border-color: #d4a373;
            background-color: #fff;
        }

        .card-footer {
            background-color: #f4eee1;
            padding: 12px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #e6dec9;
        }

        @media print {
            body { background: white; padding: 0; }
            .controls { display: none; }
            .card-container { box-shadow: none; border: 1px solid #000; }
            .editable-text { border: none !important; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="imgUpload">📁 اختر صورة</label>
        <input type="file" id="imgUpload" accept="image/*" onchange="previewImage(event)">

        <div class="color-group">
            <span style="font-size: 13px; color: #555;">اللون:</span>
            <input type="color" id="colorPicker" value="#fdfbf7" onchange="changeBg(this.value)" style="border:none; width:30px; height:30px; cursor:pointer; background:none;">
        </div>

        <button onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    </div>

    <div class="card-container" id="myCard">
        <div class="card-header" id="cardHeader">
            <h1>صَبَاحُ الخَيْرِ</h1>
            <p>أتمنى لك يوماً سعيداً ومليئاً بالخير والبركات</p>
        </div>

        <div class="card-body">
            <div class="image-box" onclick="document.getElementById('imgUpload').click();">
                <span id="imgText">اضغط هنا لرفع صورتك</span>
                <img id="preview" alt="صورة">
            </div>

            <div class="editable-text" contenteditable="true">
                اكتب رسلتك الصباحية هنا...
            </div>
        </div>

        <div class="card-footer" contenteditable="true">
            يوم موفق للجميع 🌸
        </div>
    </div>

    <script>
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function(){
                var output = document.getElementById('preview');
                output.src = reader.result;
                output.style.display = "block";
                document.getElementById('imgText').style.display = "none";
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        function changeBg(color) {
            document.getElementById('myCard').style.backgroundColor = color;
        }
    </script>

</body>
</html>
